# Salin salah satu konfigurasi provider ke Advanced settings > Secrets.
# Jangan commit API key asli.

# Opsi A: Aivene (aktif)
AI_PROVIDER = "aivene"
AIVENE_ENABLED = "true"
AIVENE_BASE_URL = "https://api.aivene.com/v1"
AIVENE_MODEL = "gpt-6-astra"
AIVENE_API_KEY = "GANTI_DENGAN_API_KEY_AIVENE"
AIVENE_TIMEOUT_SECONDS = "120"

# Opsi B: Ollama Cloud (ubah AI_PROVIDER menjadi "ollama" jika dipakai)
OLLAMA_ENABLED = "true"
OLLAMA_URL = "https://ollama.com"
OLLAMA_MODEL = "GANTI_DENGAN_TAG_MODEL_CLOUD"
OLLAMA_API_KEY = "GANTI_DENGAN_API_KEY_OLLAMA"
OLLAMA_TIMEOUT_SECONDS = "120"
